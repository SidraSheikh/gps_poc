<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadGauge Map with Offset Tool</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrollbars */
            font-family: 'Inter', sans-serif; /* A modern, clean font */
            background-color: #f0f2f5;
        }
        #map {
            height: 100vh; /* Make the map take the full viewport height */
            width: 100vw;  /* Make the map take the full viewport width */
            margin: 0;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .leaflet-popup-content {
            font-size: 14px;
            color: #333;
        }
        .loading-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 8px 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            z-index: 1000; /* Ensure it's above other elements */
            font-size: 14px;
            color: #555;
            display: none; /* Hidden by default */
        }
        /* Style for the new button */
        #calculateOffsetBtn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: background-color 0.2s;
        }
        #calculateOffsetBtn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <!-- The map container -->
    <div id="map"></div>

    <!-- The new button for calculating offsets -->
    <button id="calculateOffsetBtn">Calculate 4 Offset Points</button>

    <!-- The loading indicator -->
    <div class="loading-indicator" id="loadingIndicator">Loading points...</div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Your custom map logic script -->
    <script src="./map.js"></script>
</body>
</html>
